<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b1210;
      color: #c9f5df;
      padding: 16px;
      min-width: 280px;
    }
    h1 { font-size: 14px; color: #3ddc84; margin: 0 0 10px; }
    label {
      display: block;
      margin: 10px 0;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.4;
    }
    input { margin-right: 8px; }
  </style>
</head>
<body>
  <h1>AIchat2MD settings</h1>
  <label><input type="radio" name="uiMode" value="toolbar"> Toolbar button — click it, exports immediately</label>
  <label><input type="radio" name="uiMode" value="sidebar"> Sidebar — click the toolbar icon to open a panel with an Export button</label>
  <h1 style="margin-top:18px">Attachments (Claude, ChatGPT, DeepSeek)</h1>
  <label><input type="checkbox" id="downloadAttachments"> Also download images &amp; PDFs as a separate ZIP. Unzip it next to the .md — links point to its <code>_attachments/</code> folder. Off: they stay as links or labels, which only work while you're signed in.</label>
  <script src="options.js"></script>
</body>
</html>
